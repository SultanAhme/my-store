<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  <title>متجري</title>
</head>
<body>

  <header>
    <h1>متجري</h1>
    <nav>
      <a href="#">الرئيسية</a>
      <a href="#products">المنتجات</a>
      <a href="#">تواصل أجتماعي</a>
    </nav>
    <div class="header-action">
          <button id="theme-btn">🌙</button>
          <span id="cart-count">🛒 0</span>
          <span id="cart-total">0 ريال</span>
    </div>

  </header>

  <main id="products">
    <h2>منتجاتنا</h2>
    
    <input type="text" id="search" placeholder="ابحث عن المنتج...🔍">
    <select id="sort">
      <option value="default">الترتيب الافتراضي</option>
      <option value="low">السعر: من الأقل للأعلى</option>
      <option value="high">السعر: من الأعلى للأقل</option>
    </select>

<div class="filter">
  <button class="filter-btn active" data-filter="all">الكل</button>
  <button class="filter-btn" data-filter="phones">جوالات</button>
  <button class="filter-btn" data-filter="audio">سماعات</button>
  <button class="filter-btn" data-filter="chargers">شواحن</button>
  <button class="filter-btn" data-filter="accessories">إكسسوارات</button>
</div>

<div id="product-list" class="products-grid">


</div>


        <section class="cart">
          <h2>سلتك  🛒</h2>
          <ul id="cart-list"></ul>
        </section>
  </main>
  <footer>
    <p>© 2026 متجري</p>
  </footer>
<script src="script.js"></script>
</body>
</html>
